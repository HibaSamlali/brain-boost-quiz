<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A friendly interactive quiz for primary school students.">
  <title>Brain Boost Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
 
    <section id="start-screen" class="screen">
      <h1>Brain Boost Quiz</h1>
      <p class="lead">Six quick questions. Pick the best answer and see how many you can get right.</p>
      <p class="best" id="best-score" hidden></p>
      <button class="btn btn-primary" id="start-btn">Start quiz</button>
    </section>
 
    
    <section id="quiz-screen" class="screen" hidden>
      <header class="quiz-header">
        <span id="progress-text">Question 1 of 6</span>
        <span id="score-text">Score: 0</span>
      </header>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <h2 id="question" tabindex="-1"></h2>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button class="btn btn-primary" id="next-btn" disabled>Next question</button>
    </section>
 
    
    <section id="result-screen" class="screen" hidden>
      <div class="ring" id="ring"><span id="ring-text">0%</span></div>
      <h2 id="result-title">Well done!</h2>
      <p class="lead" id="result-message"></p>
      <div class="actions">
        <button class="btn btn-primary" id="restart-btn">Play again</button>
        <button class="btn btn-secondary" id="home-btn">Back to start</button>
      </div>
    </section>
 
  </main>
  <script src="script.js"></script>
</body>
</html>
